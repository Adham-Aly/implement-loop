<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="12" fill="#ffffff"/>

  <!-- lanes -->
  <rect x="80" y="30" width="140" height="44" rx="10" fill="#F5EDFF" stroke="#8A5CD6" stroke-width="1.5"/>
  <text x="150" y="57" text-anchor="middle" font-weight="600" fill="#1F2937">you</text>
  <rect x="410" y="30" width="140" height="44" rx="10" fill="#E8F0FE" stroke="#3B6FD9" stroke-width="1.5"/>
  <text x="480" y="57" text-anchor="middle" font-weight="600" fill="#1F2937">main session</text>
  <rect x="720" y="30" width="180" height="44" rx="10" fill="#FFF4E5" stroke="#E08A1E" stroke-width="1.5"/>
  <text x="810" y="57" text-anchor="middle" font-weight="600" fill="#1F2937">planning orchestrator</text>
  <g stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="150" y1="74" x2="150" y2="400"/><line x1="480" y1="74" x2="480" y2="400"/><line x1="810" y1="74" x2="810" y2="400"/>
  </g>

  <!-- 0 investigates -->
  <rect x="800" y="92" width="20" height="40" rx="3" fill="#FFF4E5" stroke="#E08A1E"/>
  <text x="828" y="117" fill="#374151" font-size="12.5">investigates first</text>

  <!-- 1 questions -->
  <line x1="800" y1="150" x2="490" y2="150" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="645" y="143" text-anchor="middle" fill="#1F2937" font-size="12.5">① questions + options   (fully stopped until answered)</text>

  <!-- 2 asks -->
  <line x1="470" y1="196" x2="160" y2="196" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="315" y="189" text-anchor="middle" fill="#1F2937" font-size="12.5">② asks them verbatim</text>
  <text x="315" y="212" text-anchor="middle" fill="#6B7280" font-size="11.5">structured question tool if available, else chat</text>

  <!-- 3 answers -->
  <line x1="160" y1="250" x2="470" y2="250" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="315" y="243" text-anchor="middle" fill="#1F2937" font-size="12.5">③ answers</text>

  <!-- 4 relays -->
  <line x1="490" y1="296" x2="800" y2="296" stroke="#4B5563" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="645" y="289" text-anchor="middle" fill="#1F2937" font-size="12.5">④ answers, verbatim   (also appended to task.md)</text>

  <!-- main session never thinks -->
  <rect x="470" y="180" width="20" height="130" rx="3" fill="#E8F0FE" stroke="#3B6FD9"/>
  <text x="462" y="335" text-anchor="end" fill="#3B6FD9" font-size="11.5">relay only — never rewords,</text>
  <text x="462" y="350" text-anchor="end" fill="#3B6FD9" font-size="11.5">filters, or answers the questions</text>

  <!-- loop -->
  <path d="M810,310 C880,318 880,378 810,378" fill="none" stroke="#E08A1E" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="900" y="348" text-anchor="middle" fill="#E08A1E" font-size="11.5">more rounds</text>
  <text x="900" y="363" text-anchor="middle" fill="#E08A1E" font-size="11.5">if needed</text>

  <!-- resume -->
  <rect x="800" y="306" width="20" height="60" rx="3" fill="#FFF4E5" stroke="#E08A1E"/>
  <text x="790" y="394" text-anchor="end" fill="#374151" font-size="12.5">resumes; writes plan.md on settled answers</text>
</svg>
